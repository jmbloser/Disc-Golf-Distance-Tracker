<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Send It">
<meta name="theme-color" content="#2E5233">
<title>Send It — Disc Golf Drive Log</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  html, body { margin: 0; padding: 0; height: 100%; }

  .rt-root {
    --ink: #16241C;
    --paper: #F2F4EC;
    --paper-2: #E7EBDD;
    --fairway: #2E5233;
    --fairway-dark: #203B26;
    --turf: #6FA255;
    --flag: #D9491F;
    --flag-dark: #B93B17;
    --sky: #3E7CB1;
    --line: #CDD3C1;
    --muted: #6B7566;

    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    width: 100%;
  }
  .rt-root * { box-sizing: border-box; }
  .rt-mono { font-family: 'IBM Plex Mono', monospace; }
  .rt-muted { color: var(--muted); }
  .rt-spin { animation: rt-spin 1s linear infinite; }
  @keyframes rt-spin { to { transform: rotate(360deg); } }

  .rt-shell {
    max-width: 460px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .rt-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(18px + env(safe-area-inset-top)) 16px 14px;
    border-bottom: 2px solid var(--fairway);
    background: var(--paper);
  }
  .rt-wordmark {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.03em;
    color: var(--fairway-dark);
    line-height: 1;
    display: flex; align-items: baseline; gap: 8px;
  }
  .rt-wordmark-dot { color: var(--flag); }
  .rt-tagline {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .rt-unit-toggle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    background: var(--fairway);
    color: var(--paper);
    border: none;
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
  }

  .rt-main { flex: 1; padding: 16px; padding-bottom: 8px; }
  .rt-tab-content { display: flex; flex-direction: column; gap: 14px; }

  .rt-card {
    background: #fff;
    border: 1.5px dashed var(--line);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .rt-field { display: flex; flex-direction: column; gap: 6px; }
  .rt-field-row { display: flex; gap: 10px; }
  .rt-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }
  .rt-label-note { text-transform: none; font-weight: 500; letter-spacing: 0; }
  .rt-input {
    border: 1.5px solid var(--line);
    border-radius: 9px;
    padding: 10px 11px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: var(--paper);
    width: 100%;
  }
  .rt-input:focus { outline: 2px solid var(--sky); outline-offset: 1px; }
  .rt-input::placeholder { color: var(--muted); opacity: 1; }
  .rt-input-sm { width: 84px; padding: 7px 9px; font-size: 13px; }

  .rt-color-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .rt-color-swatch-btn {
    position: relative;
    background: none; border: none; padding: 3px; cursor: pointer;
    border-radius: 50%;
  }
  .rt-color-selected-ring {
    position: absolute; inset: -2px;
    border: 2px solid var(--fairway);
    border-radius: 50%;
  }

  .rt-disc-chip {
    border-radius: 50%;
    flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
  }
  .rt-disc-chip-ring {
    width: 42%; height: 42%;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12);
  }

  .rt-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: 10px;
    padding: 12px 16px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    cursor: pointer;
    width: 100%;
  }
  .rt-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .rt-btn-flag { background: var(--flag); color: #fff; }
  .rt-btn-flag:not(:disabled):active { background: var(--flag-dark); }
  .rt-btn-fairway { background: var(--fairway); color: #fff; }
  .rt-btn-turf { background: var(--turf); color: #16241C; }
  .rt-btn-sky { background: var(--sky); color: #fff; }

  .rt-btn-sm {
    border: none; border-radius: 8px; padding: 7px 11px;
    font-size: 12.5px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    white-space: nowrap;
  }
  .rt-btn-ghost { background: var(--paper-2); color: var(--ink); }

  .rt-link-btn {
    background: none; border: none; color: var(--sky);
    font-size: 13px; font-weight: 600; cursor: pointer;
    padding: 4px 0; text-align: left; text-decoration: underline;
    text-underline-offset: 2px;
  }

  .rt-icon-btn {
    background: none; border: none; cursor: pointer;
    color: var(--muted); padding: 6px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .rt-icon-btn:hover { background: var(--paper-2); color: var(--flag); }

  .rt-section-header {
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'Oswald', sans-serif;
    font-size: 13px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--fairway-dark);
    border-bottom: 1.5px solid var(--line);
    padding-bottom: 6px;
    margin-top: 4px;
  }

  .rt-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .rt-list-row {
    display: flex; align-items: center; gap: 12px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 10px 12px;
  }
  .rt-list-main { flex: 1; min-width: 0; }
  .rt-list-title { font-weight: 600; font-size: 14.5px; }
  .rt-list-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

  .rt-confirm-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .rt-empty {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: 6px; padding: 30px 12px; color: var(--muted);
  }
  .rt-empty-title { font-weight: 600; color: var(--ink); font-size: 14.5px; margin: 2px 0 0; }
  .rt-empty-body { font-size: 13px; max-width: 260px; margin: 0; }

  .rt-select-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .rt-select-item {
    position: relative;
    display: flex; align-items: center; gap: 8px;
    border: 1.5px solid var(--line); border-radius: 10px;
    padding: 9px 10px; background: var(--paper);
    cursor: pointer; text-align: left;
  }
  .rt-select-item-on { border-color: var(--fairway); background: #E7F0E3; }
  .rt-select-item-label {
    font-size: 13px; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .rt-select-check { position: absolute; top: 6px; right: 6px; color: var(--fairway); }

  .rt-pill-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .rt-pill {
    border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 13px 7px 10px;
    background: var(--paper); font-size: 12.5px; font-weight: 600; color: var(--ink);
    cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
    font-family: 'Inter', sans-serif; max-width: 100%;
  }
  .rt-pill span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rt-pill-on { border-color: var(--fairway); background: #E7F0E3; color: var(--fairway-dark); }
  .rt-radio-dot {
    width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted);
    display: inline-block; flex-shrink: 0; box-sizing: border-box;
  }
  .rt-pill-on .rt-radio-dot { border-color: var(--fairway); background: var(--fairway); box-shadow: inset 0 0 0 2px #fff; }

  .rt-note {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    background: #FBF3E4; border: 1px solid #E8D7A8; color: #7A5A12;
    border-radius: 9px; padding: 10px 11px; font-size: 12.5px; line-height: 1.4;
  }
  .rt-note-head { display: flex; gap: 8px; align-items: flex-start; }
  .rt-help-block { margin-top: 6px; }
  .rt-help-title {
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--fairway-dark); font-weight: 600; margin-bottom: 2px;
  }
  .rt-help-text { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin: 0 0 8px; }
  .rt-error {
    display: flex; gap: 6px; align-items: center;
    color: var(--flag-dark); font-size: 12.5px; margin: 6px 0 0;
  }

  .rt-rangefinder {
    background: #16303F;
    border-radius: 14px;
    padding: 16px 18px;
    color: #C9E8F5;
  }
  .rt-rf-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .rt-rf-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: #7FB6D6; display: flex; align-items: center; gap: 6px; font-weight: 600;
  }
  .rt-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .rt-dot-good { background: #6FE38C; box-shadow: 0 0 6px #6FE38C; }
  .rt-dot-ok { background: #E3C346; }
  .rt-dot-poor { background: #E36B46; }
  .rt-dot-gray { background: #5A7180; }
  .rt-rf-number {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 46px; font-weight: 600; line-height: 1.1;
    color: #A9F0FF; margin-top: 6px;
  }
  .rt-rf-unit { font-size: 16px; margin-left: 6px; color: #7FB6D6; }
  .rt-rf-sub {
    display: flex; align-items: center; gap: 4px;
    font-size: 11.5px; color: #7FB6D6; margin-top: 8px;
  }

  .rt-throw-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--muted); padding: 10px 2px 4px;
  }

  .rt-disc-item { background: #fff; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
  .rt-disc-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    cursor: pointer; background: none; border: none; width: 100%; text-align: left;
  }
  .rt-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0 10px 10px; }
  .rt-stat { text-align: center; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; padding: 8px 4px; }
  .rt-stat-val { font-size: 14px; font-weight: 600; color: var(--fairway-dark); font-family: 'IBM Plex Mono', monospace; }
  .rt-stat-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-top: 2px; }

  .rt-select-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

  .rt-session-header { padding-bottom: 2px; }
  .rt-session-loc {
    font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 17px;
    display: flex; align-items: center; gap: 6px; color: var(--fairway-dark);
  }
  .rt-session-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .rt-title-edit-row { display: flex; align-items: center; gap: 6px; width: 100%; }
  .rt-title-edit-row .rt-input { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 16px; }

  .rt-history-item { position: relative; overflow: hidden; border-radius: 11px; }
  .rt-swipe-actions { position: absolute; inset: 0; display: flex; justify-content: flex-end; }
  .rt-swipe-delete-btn {
    width: 84px; border: none; background: var(--flag); color: #fff; font-weight: 600; font-size: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer;
  }
  .rt-swipe-content {
    position: relative; background: #fff; border: 1px solid var(--line); border-radius: 11px;
    overflow: hidden; touch-action: pan-y;
  }
  .rt-history-summary {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    background: #fff; border: none; cursor: pointer; padding: 12px;
    text-align: left; color: var(--ink);
  }
  .rt-history-detail { padding: 0 10px 10px; }

  .rt-session-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .rt-session-actions .rt-link-btn { text-align: center; }

  .rt-tabbar {
    display: flex;
    border-top: 2px solid var(--fairway);
    background: #fff;
    position: sticky; bottom: 0;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .rt-tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 9px 4px 10px; background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 11px; font-weight: 600;
  }
  .rt-tab-on { color: var(--fairway-dark); }
</style>
</head>
<body class="rt-root">
<div id="app"></div>

<script>
/* ================================================================ */
/*  Storage (localStorage — persists on-device for this site only)  */
/* ================================================================ */

var KEYS = {
  discs: "retrieve:discs",
  sessions: "retrieve:sessions",
  active: "retrieve:active-session",
  prefs: "retrieve:prefs",
  locations: "retrieve:locations",
};

function loadKey(key, fallback) {
  try {
    var v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch (e) { return fallback; }
}
function saveKey(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error("save failed", key, e); }
}
function removeKey(key) {
  try { localStorage.removeItem(key); } catch (e) {}
}
function uid() {
  return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
}

/* ================================================================ */
/*  Geo helpers                                                      */
/* ================================================================ */

var geoAvailable = (typeof navigator !== "undefined" && "geolocation" in navigator);

function haversine(a, b) {
  var R = 6371000;
  function toRad(d) { return (d * Math.PI) / 180; }
  var dLat = toRad(b.lat - a.lat);
  var dLng = toRad(b.lng - a.lng);
  var lat1 = toRad(a.lat), lat2 = toRad(b.lat);
  var s = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
}
function convert(meters, unit) { return unit === "ft" ? meters * 3.28084 : meters; }
function fmtDist(meters, unit) {
  if (meters == null || Number.isNaN(meters)) return "—";
  return Math.round(convert(meters, unit)) + " " + unit;
}
function unitToMeters(value, unit) {
  var n = parseFloat(value);
  if (Number.isNaN(n)) return null;
  return unit === "ft" ? n / 3.28084 : n;
}
function getPosition(options) {
  return new Promise(function (resolve, reject) {
    if (!geoAvailable) { reject(new Error("Location services aren't available on this device/browser.")); return; }
    navigator.geolocation.getCurrentPosition(resolve, reject, options);
  });
}

/* ================================================================ */
/*  Static data + tiny icon set (no external icon library needed)   */
/* ================================================================ */

var DISC_COLORS = [
  { name: "Red", hex: "#C7402C" }, { name: "Orange", hex: "#E2812B" },
  { name: "Yellow", hex: "#E3BE3F" }, { name: "Green", hex: "#4F9153" },
  { name: "Blue", hex: "#3E7CB1" }, { name: "Purple", hex: "#7B5EA7" },
  { name: "Pink", hex: "#D95B9C" }, { name: "White", hex: "#EDEFE7" },
  { name: "Glow", hex: "#CFE8A9" }, { name: "Black", hex: "#2B2B2B" },
];

var ICON_PATHS = {
  discicon: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/>',
  navigation: '<polygon points="3 11 22 2 13 21 11 13 3 11"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  pencil: '<path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>',
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  mappin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
  compass: '<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  loader: '<line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>',
  chevrondown: '<polyline points="6 9 12 15 18 9"/>',
  chevronup: '<polyline points="18 15 12 9 6 15"/>',
  rotate: '<polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>',
  alert: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>',
  route: '<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2H8a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h8"/>',
};
function icon(name, size, cls) {
  size = size || 16;
  return '<svg class="' + (cls || '') + '" width="' + size + '" height="' + size +
    '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round">' + (ICON_PATHS[name] || '') + '</svg>';
}
function discChip(hex, size) {
  size = size || 28;
  return '<span class="rt-disc-chip" style="width:' + size + 'px;height:' + size +
    'px;background:radial-gradient(circle at 35% 30%, ' + hex + 'ee, ' + hex +
    ')"><span class="rt-disc-chip-ring"></span></span>';
}
function discVisual(d, size) {
  size = size || 28;
  if (d && d.photo) {
    return '<span class="rt-disc-chip" style="width:' + size + 'px;height:' + size + 'px;padding:0;overflow:hidden;background:var(--paper-2)">' +
      '<img src="' + d.photo + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%" alt="">' +
    '</span>';
  }
  return discChip((d && d.color) || DISC_COLORS[4].hex, size);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function emptyState(iconHtml, title, body) {
  return '<div class="rt-empty">' + iconHtml + '<p class="rt-empty-title">' + escapeHtml(title) +
    '</p><p class="rt-empty-body">' + escapeHtml(body) + '</p></div>';
}

/* ================================================================ */
/*  App state                                                        */
/* ================================================================ */

var DISCS = [];
var SESSIONS = [];
var ACTIVE = null;
var LOCATIONS = [];
var UNIT = "ft";
var TAB = "bag";
var watchId = null;

var ui = {
  acquiring: false,
  geoError: null,
  manualMode: false,
  watching: false,
  lastPos: null,
  manualDistFor: null,
  confirmDeleteId: null,
  cancelConfirm: false,
  selectedDiscIds: new Set(),
  addFormColor: DISC_COLORS[4].hex,
  openHistoryId: null,
  openDiscStatsId: null,
  addFormPhoto: null,
  editingActiveTitle: false,
  editingSessionTitleId: null,
};

/* ================================================================ */
/*  Data migration (old single-throw sessions -> throws[] array)    */
/* ================================================================ */

function migrateSession(s) {
  if (!s) return s;
  var out = s;
  if (!s.throws) {
    out = {
      id: s.id, location: s.location, startedAt: s.startedAt, discIds: s.discIds,
      throws: [{ start: s.start || null, recoveries: s.recoveries || {}, odometerM: s.odometerM || 0 }],
    };
  }
  // migrate old session-level throw style (from a previous version) onto the first throw
  if ((s.throwType || s.throwModifier) && out.throws && out.throws[0] && !out.throws[0].throwTypeChoice && !out.throws[0].throwModifier) {
    var tt = s.throwType;
    if (tt === 'Backhand' || tt === 'Forehand') {
      out.throws[0].throwTypeChoice = tt;
    } else if (tt) {
      out.throws[0].throwTypeChoice = 'Other';
      out.throws[0].throwTypeCustom = tt;
    }
    if (s.throwModifier) out.throws[0].throwModifier = s.throwModifier;
  }
  return out;
}
function currentThrow() { return ACTIVE.throws[ACTIVE.throws.length - 1]; }
function resolvedThrowType(t) {
  if (!t) return null;
  if (t.throwTypeChoice === 'Backhand' || t.throwTypeChoice === 'Forehand') return t.throwTypeChoice;
  if (t.throwTypeChoice === 'Other') return (t.throwTypeCustom || '').trim() || null;
  return null;
}
function throwStyleLabel(t) {
  var parts = [];
  var rt = resolvedThrowType(t);
  if (rt) parts.push(rt);
  if (t.throwModifier) parts.push(t.throwModifier);
  return parts.length ? (' · ' + parts.join(' ')) : '';
}

/* ================================================================ */
/*  Saved locations (up to 4, most-recently-used)                    */
/* ================================================================ */

function addLocation(name) {
  name = name.trim();
  if (!name) return;
  var idx = LOCATIONS.findIndex(function (l) { return l.toLowerCase() === name.toLowerCase(); });
  if (idx !== -1) LOCATIONS.splice(idx, 1);
  LOCATIONS.unshift(name);
  if (LOCATIONS.length > 4) LOCATIONS = LOCATIONS.slice(0, 4);
  saveKey(KEYS.locations, LOCATIONS);
}

/* ================================================================ */
/*  Per-disc stats                                                    */
/* ================================================================ */

function discStats(discId) {
  var dists = [];
  function collect(throwsArr) {
    (throwsArr || []).forEach(function (t) {
      var r = t.recoveries && t.recoveries[discId];
      if (r) dists.push(r.distanceM);
    });
  }
  SESSIONS.forEach(function (s) { collect(s.throws); });
  if (ACTIVE) collect(ACTIVE.throws);
  if (dists.length === 0) return null;
  var sum = dists.reduce(function (a, b) { return a + b; }, 0);
  return { count: dists.length, avg: sum / dists.length, min: Math.min.apply(null, dists), max: Math.max.apply(null, dists) };
}
function statsBlockHtml(stats) {
  if (!stats) return '<p class="rt-help-text" style="padding:0 12px 10px">No recorded throws yet.</p>';
  return '<div class="rt-stats-grid">' +
    '<div class="rt-stat"><div class="rt-stat-val">' + stats.count + '</div><div class="rt-stat-label">throws</div></div>' +
    '<div class="rt-stat"><div class="rt-stat-val">' + fmtDist(stats.avg, UNIT) + '</div><div class="rt-stat-label">avg</div></div>' +
    '<div class="rt-stat"><div class="rt-stat-val">' + fmtDist(stats.min, UNIT) + '</div><div class="rt-stat-label">min</div></div>' +
    '<div class="rt-stat"><div class="rt-stat-val">' + fmtDist(stats.max, UNIT) + '</div><div class="rt-stat-label">max</div></div>' +
  '</div>';
}

function processPhotoFile(file, callback) {
  var reader = new FileReader();
  reader.onload = function (e) {
    var img = new Image();
    img.onload = function () {
      var SIZE = 128;
      var canvas = document.createElement('canvas');
      canvas.width = SIZE; canvas.height = SIZE;
      var ctx = canvas.getContext('2d');
      var scale = Math.max(SIZE / img.width, SIZE / img.height);
      var w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, (SIZE - w) / 2, (SIZE - h) / 2, w, h);
      try { callback(canvas.toDataURL('image/jpeg', 0.6)); } catch (err) { callback(null); }
    };
    img.onerror = function () { callback(null); };
    img.src = e.target.result;
  };
  reader.onerror = function () { callback(null); };
  reader.readAsDataURL(file);
}

    }
    return '<li class="rt-list-row">' + discVisual(d) + '<div class="rt-list-main"><div class="rt-list-title">' +
      escapeHtml(d.brand) + '</div></div><button class="rt-btn-sm rt-btn-turf" data-action="mark-found" data-id="' + id + '">Mark found</button></li>';
  }).join('');

  var recRows = recovered.slice().sort(function (x, y) { return t.recoveries[y].distanceM - t.recoveries[x].distanceM; })
    .map(function (id) {
      var d = DISCS.find(function (x) { return x.id === id; });
      if (!d) return '';
      var r = t.recoveries[id];
      return '<li class="rt-list-row">' + discVisual(d) + '<div class="rt-list-main"><div class="rt-list-title">' +
        escapeHtml(d.brand) + '</div><div class="rt-list-sub rt-mono">' + fmtDist(r.distanceM, UNIT) +
        (r.method === 'manual' ? ' · manual' : '') + '</div></div>' +
        '<button class="rt-icon-btn" data-action="undo-recovery" data-id="' + id + '" title="Undo">' + icon('rotate', 15) + '</button></li>';
    }).join('');

  var throwLabel = a.throws.length > 1 ? ' · throw ' + a.throws.length : '';
  var titleBlock = ui.editingActiveTitle
    ? '<div class="rt-session-header"><div class="rt-title-edit-row">' +
        '<input class="rt-input" id="edit-active-title-input" value="' + escapeHtml(a.location || '') + '" placeholder="Untitled session">' +
        '<button class="rt-icon-btn" data-action="save-active-title" title="Save">' + icon('check', 16) + '</button>' +
        '<button class="rt-icon-btn" data-action="cancel-active-title" title="Cancel">' + icon('x', 16) + '</button>' +
      '</div></div>'
    : '<div class="rt-session-header"><div>' +
        '<div class="rt-session-loc">' + icon('mappin', 15) + ' <span>' + escapeHtml(a.location || 'Untitled session') + '</span>' +
          '<button class="rt-icon-btn" data-action="edit-active-title" title="Rename">' + icon('pencil', 14) + '</button></div>' +
        '<div class="rt-session-meta rt-mono" id="session-meta">' +
          escapeHtml(new Date(a.startedAt).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) +
          ' · ' + a.discIds.length + ' disc' + (a.discIds.length !== 1 ? 's' : '') + throwLabel + throwStyleLabel(t)) + '</div></div></div>';

  var html = '<div class="rt-tab-content">' + titleBlock;

  html += throwStyleCardHtml(t);
  html += startBlock;
  if (t.start) {
    html += rangefinder;
    html += '<div class="rt-section-header"><span>Still out (' + outstanding.length + ')</span></div>';
    html += outstanding.length === 0
      ? '<p class="rt-empty-body" style="padding:4px 0 12px">All discs recovered.</p>'
      : '<ul class="rt-list">' + outRows + '</ul>';
    if (recovered.length > 0) {
      html += '<div class="rt-section-header"><span>Recovered (' + recovered.length + ')</span></div>';
      html += '<ul class="rt-list">' + recRows + '</ul>';
    }
  }

  html += '<div class="rt-session-actions">';
  if (t.start && outstanding.length === 0) {
    html += '<button class="rt-btn rt-btn-turf" data-action="next-throw">' + icon('rotate', 16) + ' Next throw — same discs</button>';
  }
  html += '<button class="rt-btn rt-btn-fairway" data-action="end-session">End session</button>';
  html += ui.cancelConfirm
    ? '<div class="rt-confirm-row" style="justify-content:center"><span class="rt-empty-body" style="padding:0">Discard this session?</span>' +
      '<button class="rt-btn-sm rt-btn-flag" data-action="confirm-cancel-session">Discard</button>' +
      '<button class="rt-btn-sm rt-btn-ghost" data-action="keep-going">Keep going</button></div>'
    : '<button class="rt-link-btn" data-action="ask-cancel-session">Discard session</button>';
  html += '</div></div>';
  return html;
}

function doLogStartGps() {
  if (!geoAvailable) { ui.manualMode = true; renderMain(); return; }
  ui.geoError = null; ui.acquiring = true; renderMain();
  getPosition({ enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }).then(function (pos) {
    var t = currentThrow();
    t.start = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy, at: Date.now(), method: 'gps' };
    saveKey(KEYS.active, ACTIVE);
    ui.acquiring = false;
    startTracking();
    renderMain();
  }).catch(function (err) {
    ui.geoError = (err && (err.message || err.code)) ? (err.message || ('Error code ' + err.code)) : "Couldn't get a GPS fix.";
    ui.acquiring = false;
    renderMain();
  });
}
function doLogStartManual() {
  var t = currentThrow();
  t.start = { at: Date.now(), method: 'manual' };
  saveKey(KEYS.active, ACTIVE);
  renderMain();
}
function startTracking() {
  if (!geoAvailable) return;
  ui.watching = true;
  watchId = navigator.geolocation.watchPosition(function (pos) {
    var t = currentThrow();
    var next = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
    if (ui.lastPos && pos.coords.accuracy < 30) {
      var d = haversine(ui.lastPos, next);
      if (d > 2) { t.odometerM = (t.odometerM || 0) + d; saveKey(KEYS.active, ACTIVE); }
    }
    ui.lastPos = next; ui.geoError = null;
    updateRangefinderDom();
  }, function (err) {
    ui.geoError = err.message || 'Lost GPS signal.';
    updateRangefinderDom();
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 });
}
function stopTracking() {
  if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  ui.watching = false;
}
function updateRangefinderDom() {
  var numEl = document.getElementById('rf-number');
  if (!numEl || !ACTIVE) return;
  var t = currentThrow();
  var live = (t.start && t.start.method === 'gps' && ui.lastPos) ? haversine(t.start, ui.lastPos) : null;
  numEl.innerHTML = (live != null ? Math.round(convert(live, UNIT)) : '—') + '<span class="rt-rf-unit">' + UNIT + '</span>';
  var subEl = document.getElementById('rf-sub');
  if (subEl) {
    subEl.innerHTML = icon('route', 12) + ' walked ' + fmtDist(t.odometerM || 0, UNIT) +
      (ui.lastPos ? ' · ' + icon('clock', 12) + ' ±' + Math.round(ui.lastPos.accuracy) + 'm' : '');
  }
  var dotEl = document.getElementById('acc-dot');
  if (dotEl) {
    var accColor = !ui.lastPos ? 'gray' : ui.lastPos.accuracy < 10 ? 'good' : ui.lastPos.accuracy < 30 ? 'ok' : 'poor';
    dotEl.className = 'rt-dot rt-dot-' + accColor;
  }
}
function doMarkFound(id) {
  var t = currentThrow();
  var live = (t.start.method === 'gps' && ui.lastPos) ? haversine(t.start, ui.lastPos) : null;
  if (live != null) {
    t.recoveries[id] = { distanceM: live, at: Date.now(), method: 'gps', accuracy: ui.lastPos.accuracy };
    saveKey(KEYS.active, ACTIVE);
    renderMain();
  } else {
    ui.manualDistFor = id;
    renderMain();
  }
}
function doConfirmManualDist(id) {
  var input = document.getElementById('manual-dist-input');
  var m = unitToMeters(input.value, UNIT);
  if (m == null) { input.focus(); return; }
  var t = currentThrow();
  t.recoveries[id] = { distanceM: m, at: Date.now(), method: 'manual' };
  saveKey(KEYS.active, ACTIVE);
  ui.manualDistFor = null;
  renderMain();
}
function doUndoRecovery(id) {
  var t = currentThrow();
  delete t.recoveries[id];
  saveKey(KEYS.active, ACTIVE);
  renderMain();
}
function doNextThrow() {
  stopTracking();
  var prev = currentThrow();
  ACTIVE.throws.push({
    start: null, recoveries: {}, odometerM: 0,
    throwTypeChoice: prev.throwTypeChoice || null,
    throwTypeCustom: prev.throwTypeCustom || '',
    throwModifier: prev.throwModifier || null,
  });
  saveKey(KEYS.active, ACTIVE);
  ui.lastPos = null; ui.geoError = null; ui.manualDistFor = null;
  if (geoAvailable && !ui.manualMode) {
    doLogStartGps();
  } else {
    renderMain();
  }
}
function doEndSession() {
  stopTracking();
  if (ACTIVE) { SESSIONS.push(ACTIVE); saveKey(KEYS.sessions, SESSIONS); }
  ACTIVE = null; removeKey(KEYS.active);
  ui.cancelConfirm = false; ui.manualDistFor = null; ui.manualMode = false;
  ui.lastPos = null; ui.geoError = null;
  TAB = 'throw';
  renderTabbar(); renderMain();
}
function doCancelSession() {
  stopTracking();
  ACTIVE = null; removeKey(KEYS.active);
  ui.cancelConfirm = false; ui.manualDistFor = null; ui.manualMode = false; ui.lastPos = null;
  renderMain();
}
function doSaveActiveTitle() {
  var input = document.getElementById('edit-active-title-input');
  if (!input || !ACTIVE) return;
  var val = input.value.trim();
  ACTIVE.location = val;
  saveKey(KEYS.active, ACTIVE);
  if (val) addLocation(val);
  ui.editingActiveTitle = false;
  renderMain();
}
function doSaveSessionTitle(id) {
  var input = document.getElementById('edit-title-input-' + id);
  if (!input) return;
  var val = input.value.trim();
  var s = SESSIONS.find(function (x) { return x.id === id; });
  if (s) {
    s.location = val;
    saveKey(KEYS.sessions, SESSIONS);
    if (val) addLocation(val);
  }
  ui.editingSessionTitleId = null;
  renderMain();
}

/* ================================================================ */
/*  History tab                                                       */
/* ================================================================ */

function historyTabHtml() {
  swipe.openId = null;
  if (SESSIONS.length === 0) {
    return '<div class="rt-tab-content">' +
      emptyState(icon('clock', 28), 'No sessions yet', 'Finished sessions from the Throw tab will show up here.') + '</div>';
  }
  var sorted = SESSIONS.slice().sort(function (a, b) { return b.startedAt - a.startedAt; });
  var rows = sorted.map(function (s) {
    var throwsArr = s.throws || [];
    var allDists = [];
    throwsArr.forEach(function (t) {
      Object.keys(t.recoveries || {}).forEach(function (k) { allDists.push(t.recoveries[k].distanceM); });
    });
    var avg = allDists.length ? allDists.reduce(function (x, y) { return x + y; }, 0) / allDists.length : null;
    var isOpen = ui.openHistoryId === s.id;
    var throwCount = throwsArr.length;

    var detail = '';
    if (isOpen) {
      detail = throwsArr.map(function (t, i) {
        var throwRows = s.discIds.slice().sort(function (a, b) {
          var ra = (t.recoveries && t.recoveries[a]) ? t.recoveries[a].distanceM : -1;
          var rb = (t.recoveries && t.recoveries[b]) ? t.recoveries[b].distanceM : -1;
          return rb - ra;
        }).map(function (id) {
          var d = DISCS.find(function (x) { return x.id === id; });
          var r = t.recoveries ? t.recoveries[id] : null;
          return '<li class="rt-list-row">' + discVisual(d, 22) +
            '<div class="rt-list-main"><div class="rt-list-title">' + (d ? escapeHtml(d.brand) : 'Unknown disc') + '</div></div>' +
            '<div class="rt-mono rt-list-sub">' + (r ? fmtDist(r.distanceM, UNIT) : 'not recovered') + '</div></li>';
        }).join('');
        var tStyle = throwStyleLabel(t);
        var label = (throwCount > 1 || tStyle)
          ? '<div class="rt-throw-label">' + (throwCount > 1 ? ('Throw ' + (i + 1)) : 'Throw') + escapeHtml(tStyle) + '</div>'
          : '';
        return label + '<ul class="rt-list rt-history-detail">' + throwRows + '</ul>';
      }).join('');
    }

    var editingTitle = ui.editingSessionTitleId === s.id;
    var summaryInner = editingTitle
      ? '<div class="rt-title-edit-row" style="padding:12px">' +
          '<input class="rt-input" id="edit-title-input-' + s.id + '" value="' + escapeHtml(s.location || '') + '" placeholder="Untitled session">' +
          '<button class="rt-icon-btn" data-action="save-session-title" data-id="' + s.id + '" title="Save">' + icon('check', 16) + '</button>' +
          '<button class="rt-icon-btn" data-action="cancel-session-title" title="Cancel">' + icon('x', 16) + '</button>' +
        '</div>'
      : '<div class="rt-history-summary" data-action="toggle-history" data-id="' + s.id + '">' +
        '<div><div class="rt-list-title">' + escapeHtml(s.location || 'Untitled session') + '</div><div class="rt-list-sub rt-mono">' +
        new Date(s.startedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) +
        ' · ' + s.discIds.length + ' disc' + (s.discIds.length !== 1 ? 's' : '') +
        (throwCount > 1 ? ' · ' + throwCount + ' throws' : '') +
        (avg != null ? ' · avg ' + fmtDist(avg, UNIT) : '') + '</div></div>' +
        '<button class="rt-icon-btn" data-action="edit-session-title" data-id="' + s.id + '" title="Rename">' + icon('pencil', 15) + '</button>' +
        (isOpen ? icon('chevronup', 18) : icon('chevrondown', 18)) + '</div>';

    return '<li class="rt-history-item">' +
      '<div class="rt-swipe-actions"><button class="rt-swipe-delete-btn" data-action="delete-session" data-id="' + s.id + '">' +
        icon('trash', 18) + '<span>Delete</span></button></div>' +
      '<div class="rt-swipe-content" data-id="' + s.id + '">' +
        summaryInner + detail +
      '</div>' +
    '</li>';
  }).join('');
  return '<div class="rt-tab-content"><p class="rt-empty-body" style="padding:0 2px">Swipe a session left to delete.</p>' +
    '<ul class="rt-list" id="history-list">' + rows + '</ul></div>';
}
function doDeleteSession(id) {
  SESSIONS = SESSIONS.filter(function (s) { return s.id !== id; });
  saveKey(KEYS.sessions, SESSIONS);
  if (ui.openHistoryId === id) ui.openHistoryId = null;
  renderMain();
}

/* ================================================================ */
/*  Swipe-to-delete (history rows)                                    */
/* ================================================================ */

function swipePointerDown(e) {
  var content = e.target.closest('.rt-swipe-content');
  if (!content) return;
  swipe.active = true;
  swipe.id = content.dataset.id;
  swipe.el = content;
  swipe.startX = e.clientX; swipe.startY = e.clientY;
  swipe.baseX = (swipe.openId === swipe.id) ? -84 : 0;
  swipe.dx = swipe.baseX;
  swipe.locked = null;
  swipe.wasDrag = false;
  content.style.transition = 'none';
  try { content.setPointerCapture(e.pointerId); } catch (err) {}
}
function swipePointerMove(e) {
  if (!swipe.active) return;
  var dx = e.clientX - swipe.startX;
  var dy = e.clientY - swipe.startY;
  if (swipe.locked === null) {
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) swipe.locked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }
  if (swipe.locked !== 'x') return;
  swipe.wasDrag = true;
  var pos = Math.max(-84, Math.min(0, swipe.baseX + dx));
  swipe.dx = pos;
  swipe.el.style.transform = 'translateX(' + pos + 'px)';
}
function swipePointerUp() {
  if (!swipe.active) return;
  swipe.active = false;
  if (swipe.el) {
    swipe.el.style.transition = '';
    if (swipe.dx < -40) {
      swipe.el.style.transform = 'translateX(-84px)';
      swipe.openId = swipe.id;
    } else {
      swipe.el.style.transform = 'translateX(0)';
      if (swipe.openId === swipe.id) swipe.openId = null;
    }
  }
  swipe.locked = null;
}

/* ================================================================ */
/*  Shell / render / boot                                             */
/* ================================================================ */

function renderMain() {
  var main = document.getElementById('main');
  if (TAB === 'bag') main.innerHTML = bagTabHtml();
  else if (TAB === 'throw') main.innerHTML = ACTIVE ? activeSessionHtml() : startSessionHtml();
  else main.innerHTML = historyTabHtml();
}
function renderTabbar() {
  document.getElementById('tabbar').innerHTML =
    '<button class="rt-tab ' + (TAB === 'bag' ? 'rt-tab-on' : '') + '" data-action="set-tab" data-id="bag">' + icon('discicon', 19) + '<span>Bag</span></button>' +
    '<button class="rt-tab ' + (TAB === 'throw' ? 'rt-tab-on' : '') + '" data-action="set-tab" data-id="throw">' + icon('navigation', 19) + '<span>Throw</span></button>' +
    '<button class="rt-tab ' + (TAB === 'history' ? 'rt-tab-on' : '') + '" data-action="set-tab" data-id="history">' + icon('clock', 19) + '<span>History</span></button>';
}

function buildShell() {
  document.getElementById('app').innerHTML =
    '<div class="rt-shell">' +
      '<header class="rt-topbar">' +
        '<div class="rt-wordmark">SEND IT<span class="rt-wordmark-dot">.</span><span class="rt-tagline">drive practice log</span></div>' +
        '<button class="rt-unit-toggle" id="unit-btn" data-action="toggle-unit">' + UNIT + '</button>' +
      '</header>' +
      '<main class="rt-main" id="main"></main>' +
      '<nav class="rt-tabbar" id="tabbar"></nav>' +
    '</div>';
}

function handleClick(e) {
  if (swipe.wasDrag) { swipe.wasDrag = false; return; }
  var btn = e.target.closest('[data-action]');
  if (!btn) return;
  var action = btn.dataset.action, id = btn.dataset.id;
  switch (action) {
    case 'set-tab': TAB = id; renderTabbar(); renderMain(); break;
    case 'select-color': doSelectColor(btn.dataset.hex); break;
    case 'trigger-photo-capture': triggerPhotoCapture(); break;
    case 'clear-add-photo': doClearAddPhoto(); break;
    case 'add-disc': doAddDisc(); break;
    case 'remove-disc-ask': ui.confirmDeleteId = id; renderMain(); break;
    case 'remove-disc-confirm': doRemoveDisc(id); break;
    case 'remove-disc-cancel': ui.confirmDeleteId = null; renderMain(); break;
    case 'toggle-disc-stats': ui.openDiscStatsId = (ui.openDiscStatsId === id ? null : id); renderMain(); break;
    case 'toggle-select-disc': doToggleSelectDisc(id, btn); break;
    case 'pick-location': doPickLocation(btn.dataset.loc, btn); break;
    case 'pick-throwtype': doPickThrowTypeLive(btn.dataset.val, btn); break;
    case 'pick-modifier': doPickModifierLive(btn.dataset.val, btn); break;
    case 'toggle-gps-help': toggleGpsHelp(); break;
    case 'begin-session': doBeginSession(); break;
    case 'log-start-gps': doLogStartGps(); break;
    case 'enable-manual-mode': ui.manualMode = true; renderMain(); break;
    case 'disable-manual-mode': ui.manualMode = false; ui.geoError = null; renderMain(); break;
    case 'log-start-manual': doLogStartManual(); break;
    case 'toggle-tracking': if (ui.watching) stopTracking(); else startTracking(); renderMain(); break;
    case 'mark-found': doMarkFound(id); break;
    case 'confirm-manual-dist': doConfirmManualDist(id); break;
    case 'cancel-manual-dist': ui.manualDistFor = null; renderMain(); break;
    case 'undo-recovery': doUndoRecovery(id); break;
    case 'next-throw': doNextThrow(); break;
    case 'end-session': doEndSession(); break;
    case 'ask-cancel-session': ui.cancelConfirm = true; renderMain(); break;
    case 'keep-going': ui.cancelConfirm = false; renderMain(); break;
    case 'confirm-cancel-session': doCancelSession(); break;
    case 'toggle-history': ui.openHistoryId = (ui.openHistoryId === id ? null : id); renderMain(); break;
    case 'delete-session': doDeleteSession(id); break;
    case 'edit-active-title': ui.editingActiveTitle = true; renderMain(); break;
    case 'save-active-title': doSaveActiveTitle(); break;
    case 'cancel-active-title': ui.editingActiveTitle = false; renderMain(); break;
    case 'edit-session-title': ui.editingSessionTitleId = id; renderMain(); break;
    case 'save-session-title': doSaveSessionTitle(id); break;
    case 'cancel-session-title': ui.editingSessionTitleId = null; renderMain(); break;
    case 'toggle-unit':
      UNIT = UNIT === 'ft' ? 'm' : 'ft';
      saveKey(KEYS.prefs, { unit: UNIT });
      document.getElementById('unit-btn').textContent = UNIT;
      renderMain();
      break;
  }
}

function boot() {
  DISCS = loadKey(KEYS.discs, []);
  SESSIONS = loadKey(KEYS.sessions, []).map(migrateSession);
  var rawActive = loadKey(KEYS.active, null);
  ACTIVE = rawActive ? migrateSession(rawActive) : null;
  LOCATIONS = loadKey(KEYS.locations, []);
  UNIT = (loadKey(KEYS.prefs, { unit: 'ft' }) || {}).unit || 'ft';
  TAB = ACTIVE ? 'throw' : 'bag';
  buildShell();
  renderTabbar();
  renderMain();
  var app = document.getElementById('app');
  app.addEventListener('click', handleClick);
  app.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'throwtype-other-input') onThrowTypeOtherInput(e);
  });
  app.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'add-photo-input') onAddPhotoInputChange(e);
  });
  app.addEventListener('pointerdown', swipePointerDown);
  app.addEventListener('pointermove', swipePointerMove);
  app.addEventListener('pointerup', swipePointerUp);
  app.addEventListener('pointercancel', swipePointerUp);
}

document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
